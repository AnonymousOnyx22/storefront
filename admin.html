<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>slate - seller console</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Crect x='4' y='4' width='24' height='24' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Crect x='8' y='8' width='7' height='7' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<header class="adm-bar">
  <a href="admin.html" class="brand"><span class="d">slate/</span>slate<span class="cur">_</span></a>
  <span class="adm-where">~/admin</span>
  <span class="adm-spacer"></span>
  <span class="badge" id="admEnv">locked</span>
  <button class="btn ghost" id="admOut" hidden>sign out</button>
</header>

<main class="adm">
  <section id="gate" class="adm-gate">
    <form id="gateForm" class="term" novalidate>
      <div class="term-bar"><span>~/admin/auth</span><span id="gateBar"></span></div>
      <div class="adm-gate-body">
        <div class="field"><label for="admToken">token</label><input id="admToken" type="password" autocomplete="off" spellcheck="false" placeholder="admin token"></div>
        <div class="field"><label for="admOtp">2fa</label><input id="admOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" spellcheck="false" placeholder="6 digits"></div>
        <div class="row"><button class="btn" type="submit" id="gateSubmit">unlock</button></div>
        <div class="status" id="gateStatus" role="status" aria-live="polite"></div>
        <p class="note">Token lives in <code>ADMIN_TOKEN</code>; the 2fa code is checked against <code>ADMIN_TOTP_SECRET</code>, which is required. The token stays in this tab and dies with it.</p>
      </div>
    </form>
  </section>

  <section id="console" hidden>
    <div class="adm-stats" id="admStats"></div>

    <div class="adm-tools">
      <input id="admQ" type="search" placeholder="search email, key, tier or machine" autocomplete="off" spellcheck="false">
      <select id="admPer" aria-label="rows per page">
        <option value="25">25</option>
        <option value="40" selected>40</option>
        <option value="100">100</option>
      </select>
      <button type="button" id="admRefresh">refresh</button>
      <button type="button" id="admExport">export csv</button>
      <button type="button" id="admMode">tickets</button>
      <span class="adm-count" id="admCount"></span>
    </div>

    <div class="adm-grid">
      <div class="adm-list">
        <div class="adm-head">
          <span>email</span><span>tier</span><span>expires</span><span>resets</span><span>machine</span><span>state</span>
        </div>
        <div id="admRows"></div>
      </div>
      <aside class="adm-detail" id="admDetail" hidden></aside>
    </div>
  </section>
</main>

<div class="adm-toast" id="admToast" role="status" aria-live="polite"></div>

<script src="assets/admin.js"></script>
</body>
</html>
